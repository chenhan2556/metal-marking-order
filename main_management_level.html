<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北大綠茶季 - 總管理後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900 min-h-screen relative">

  <div id="login-screen" class="fixed inset-0 z-[100] bg-slate-900 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-8 text-center animate-in zoom-in duration-300">
      <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
        <i data-lucide="shield-check" class="w-10 h-10"></i>
      </div>
      <h2 class="text-2xl font-black text-slate-800 mb-2">管理系統登入</h2>
      <p class="text-slate-500 text-sm mb-6">請輸入您的職級密碼以載入工作區</p>
      
      <input type="password" id="login-pw-input" placeholder="請輸入密碼" class="w-full px-4 py-4 rounded-xl border-2 border-slate-200 focus:border-emerald-500 outline-none text-center text-xl tracking-[0.5em] font-mono bg-slate-50 transition-colors mb-2">
      <p id="login-error-msg" class="text-red-500 text-sm font-bold mb-4 hidden">密碼錯誤，請重新輸入！</p>
      
      <button onclick="performLogin()" class="w-full bg-slate-800 hover:bg-slate-700 text-white rounded-xl py-4 font-bold text-lg transition-all shadow-lg flex items-center justify-center mt-4">
        進入系統 <i data-lucide="arrow-right" class="w-5 h-5 ml-2"></i>
      </button>
      
      <div class="mt-6 pt-6 border-t border-slate-100 text-xs text-slate-400 text-left space-y-1">
        <p>💡 測試密碼提示：</p>
        <p>Lv3 總召: 3333 (完整權限)</p>
        <p>Lv2 幹部: 2222 (無刪除/設定權限)</p>
        <p>Lv1 現場: 1111 (僅限製作/交付)</p>
      </div>
    </div>
  </div>

  <div id="custom-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden">
      <div class="p-6 text-center">
        <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
          <i data-lucide="alert-triangle" class="w-8 h-8"></i>
        </div>
        <h3 id="modal-title" class="text-xl font-bold text-slate-800 mb-2">安全驗證</h3>
        <p id="modal-desc" class="text-slate-500 text-sm mb-4">請輸入最高權限密碼以繼續</p>
        <input type="password" id="admin-pw-input" placeholder="輸入密碼" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-red-500 outline-none text-center text-lg bg-slate-50">
        <p id="pw-error-msg" class="text-red-500 text-sm font-bold mt-2 hidden">密碼錯誤！</p>
      </div>
      <div class="flex border-t">
        <button onclick="closeModal()" class="flex-1 px-4 py-4 text-slate-600 font-bold hover:bg-slate-50 border-r">取消</button>
        <button onclick="confirmAction()" class="flex-1 px-4 py-4 text-red-600 font-bold hover:bg-red-50">確認執行</button>
      </div>
    </div>
  </div>

  <div id="toast-msg" class="hidden fixed top-4 right-4 z-50 bg-slate-800 text-white px-6 py-3 rounded-xl shadow-lg font-bold flex items-center">
    <i data-lucide="info" class="w-5 h-5 mr-2"></i> <span id="toast-text">提示訊息</span>
  </div>

  <nav class="bg-white border-b sticky top-0 z-20 px-4 py-3 flex justify-between items-center overflow-x-auto shadow-sm">
    <div class="flex space-x-2 shrink-0" id="nav-buttons">
      <button onclick="switchView('marking')" id="nav-marking" class="px-4 py-2 rounded-lg text-sm font-bold flex items-center space-x-2 transition-colors bg-orange-600 text-white">
        <i data-lucide="pen-tool" class="w-4 h-4"></i> <span>打標製作</span>
      </button>
      <button onclick="switchView('finishing')" id="nav-finishing" class="px-4 py-2 rounded-lg text-sm font-bold flex items-center space-x-2 transition-colors hover:bg-slate-100 text-slate-600">
        <i data-lucide="package" class="w-4 h-4"></i> <span>包裝交付</span>
      </button>
      <button onclick="switchView('admin')" id="nav-admin" class="px-4 py-2 rounded-lg text-sm font-bold flex items-center space-x-2 transition-colors hover:bg-slate-100 text-slate-600">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> <span>營運總覽</span>
      </button>
      <button onclick="switchView('settings')" id="nav-settings" class="px-4 py-2 rounded-lg text-sm font-bold flex items-center space-x-2 transition-colors hover:bg-slate-100 text-slate-600">
        <i data-lucide="settings" class="w-4 h-4"></i> <span>參數設定</span>
      </button>
    </div>
    <div class="text-xs text-slate-400 shrink-0 ml-4 flex items-center">
      <span id="role-badge" class="font-bold mr-3 px-2 py-0.5 rounded bg-slate-100 text-slate-600">未登入</span>
      <i data-lucide="refresh-cw" class="w-3 h-3 mr-1"></i> <span id="last-update">同步中...</span>
    </div>
  </nav>
     
  <main class="max-w-6xl mx-auto p-4 pb-20 mt-4">
    <div id="loading-spinner" class="flex justify-center items-center py-20 hidden">
      <i data-lucide="loader" class="animate-spin text-emerald-500 w-12 h-12"></i>
    </div>

    <div id="view-marking" class="hidden grid gap-4 md:grid-cols-2 lg:grid-cols-3"></div>
    <div id="view-finishing" class="hidden space-y-4"></div>
    
    <div id="view-admin" class="hidden space-y-6">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="admin-stats"></div>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-5 border-b flex justify-between items-center bg-slate-50 flex-wrap gap-2">
          <h3 class="font-bold text-slate-800 flex items-center text-lg"><i data-lucide="list" class="w-5 h-5 mr-2 text-slate-500"></i> 訂單明細</h3>
          <div class="flex space-x-2">
            <button id="btn-clear-all" onclick="requestClearAll()" class="px-4 py-2 text-sm bg-white border border-red-200 text-red-600 hover:bg-red-50 rounded-xl flex items-center font-bold">
              <i data-lucide="trash-2" class="w-4 h-4 mr-1"></i> 全部清空
            </button>
            <button onclick="exportToCSV()" class="px-4 py-2 text-sm bg-slate-800 text-white hover:bg-slate-700 rounded-xl flex items-center font-bold">
              <i data-lucide="download" class="w-4 h-4 mr-1"></i> 匯出 CSV
            </button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left whitespace-nowrap">
            <thead class="bg-slate-50 text-slate-500 font-bold border-b">
              <tr><th class="px-5 py-4">#編號</th><th class="px-5 py-4">顧客資訊</th><th class="px-5 py-4">商品規格與加購</th><th class="px-5 py-4">單價</th><th class="px-5 py-4">狀態</th><th class="px-5 py-4">進度</th><th class="px-5 py-4 text-right" id="th-action">操作</th></tr>
            </thead>
            <tbody id="admin-table-body" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="view-settings" class="hidden space-y-6 max-w-4xl mx-auto">
      <div class="bg-blue-50 border border-blue-200 text-blue-800 p-4 rounded-xl flex items-start shadow-sm mb-6">
        <i data-lucide="info" class="w-6 h-6 mr-3 shrink-0 mt-0.5"></i>
        <div>
          <h4 class="font-bold text-lg mb-1">參數管理說明</h4>
          <p class="text-sm">您可以在此快速修改庫存數量與商品上下架狀態。</p>
        </div>
      </div>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="bg-slate-800 p-4 text-white font-bold flex items-center"><i data-lucide="box" class="w-5 h-5 mr-2"></i> 商品與庫存管理</div>
        <div class="p-0 overflow-x-auto">
          <table class="w-full text-sm text-left whitespace-nowrap">
            <thead class="bg-slate-50 text-slate-500 font-bold border-b"><tr><th class="px-5 py-3">造型</th><th class="px-5 py-3">顏色</th><th class="px-5 py-3 w-48">目前庫存</th><th class="px-5 py-3">操作</th></tr></thead>
            <tbody id="settings-inv-body" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
      <div class="grid md:grid-cols-2 gap-6">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="bg-slate-800 p-4 text-white font-bold flex items-center"><i data-lucide="image" class="w-5 h-5 mr-2"></i> 圖樣上下架</div>
          <div class="p-0 overflow-x-auto">
            <table class="w-full text-sm text-left whitespace-nowrap">
              <thead class="bg-slate-50 text-slate-500 font-bold border-b"><tr><th class="px-4 py-3">圖樣名稱</th><th class="px-4 py-3 text-center">預覽</th><th class="px-4 py-3 text-right">狀態切換</th></tr></thead>
              <tbody id="settings-pat-body" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </div>
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="bg-slate-800 p-4 text-white font-bold flex items-center"><i data-lucide="type" class="w-5 h-5 mr-2"></i> 字型上下架</div>
          <div class="p-0 overflow-x-auto">
            <table class="w-full text-sm text-left whitespace-nowrap">
              <thead class="bg-slate-50 text-slate-500 font-bold border-b"><tr><th class="px-4 py-3">字型名稱</th><th class="px-4 py-3 text-center">預覽</th><th class="px-4 py-3 text-right">狀態切換</th></tr></thead>
              <tbody id="settings-font-body" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div id="empty-state" class="hidden text-center py-20 text-slate-400 bg-white rounded-2xl border border-dashed">
      <i data-lucide="monitor" class="mx-auto mb-4 w-12 h-12 opacity-20"></i><p class="text-lg">目前沒有此狀態的訂單！</p>
    </div>
  </main>

  <script>
    // === 替換成你的 Google Apps Script API 網址 ===
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwEQg5Fh5nQvvJkWF2JuaRDMg2MmlR7OoTZzG28aWJV_ae2PRmVWTT6GhNNbEevhii2/exec"; 
    
    // ====== 權限設定區 ======
    const PASS_LV3 = "3333"; // 最高權限 (總覽、設定、刪除)
    const PASS_LV2 = "2222"; // 第二級 (總覽，不可設定、不可刪除)
    const PASS_LV1 = "1111"; // 第一級 (僅打標與交付)

    let currentRole = null; // 'admin' | 'manager' | 'staff'
    
    // ====== 系統變數 ======
    let orders = [];
    let configData = null; 
    let currentView = 'marking';
    let autoRefreshTimer = null;
    let pendingAction = null; 

    const imageMap = {
      pattern: { '1': 'https://i.meee.com.tw/bsoZFsu.jpg', '2': 'https://i.meee.com.tw/0liXWzL.jpg', '3': 'https://i.meee.com.tw/PwNdbMp.jpg', '4': 'https://i.meee.com.tw/XOoytKf.jpg', '5': 'https://i.meee.com.tw/D5Y5Ksp.jpg' },
      font: { '俏黑': 'https://i.meee.com.tw/bbavF7r.jpg', '魏碑': 'https://i.meee.com.tw/zv9bHiC.jpg', '甜妞': 'https://i.meee.com.tw/Kzt9cgG.jpg' }
    };

    window.onload = () => { lucide.createIcons(); };

    // ====== 登入與權限控制邏輯 ======
    function performLogin() {
      const pw = document.getElementById('login-pw-input').value;
      const roleBadge = document.getElementById('role-badge');

      if (pw === PASS_LV3) {
        currentRole = 'admin';
        roleBadge.textContent = 'Lv3 最高權限';
        roleBadge.className = 'font-bold mr-3 px-2 py-0.5 rounded bg-red-100 text-red-700';
      } else if (pw === PASS_LV2) {
        currentRole = 'manager';
        roleBadge.textContent = 'Lv2 營運幹部';
        roleBadge.className = 'font-bold mr-3 px-2 py-0.5 rounded bg-blue-100 text-blue-700';
      } else if (pw === PASS_LV1) {
        currentRole = 'staff';
        roleBadge.textContent = 'Lv1 現場人員';
        roleBadge.className = 'font-bold mr-3 px-2 py-0.5 rounded bg-emerald-100 text-emerald-700';
      } else {
        document.getElementById('login-error-msg').classList.remove('hidden');
        return;
      }

      // 套用權限 UI 隱藏邏輯
      applyPermissions();

      // 關閉登入畫面，啟動系統
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('loading-spinner').classList.remove('hidden');
      fetchAllData();
      startAutoRefresh();
    }

    // 支援按 Enter 登入
    document.getElementById('login-pw-input').addEventListener('keypress', e => { if (e.key === 'Enter') performLogin(); });

    function applyPermissions() {
      // 第一級員工：看不到總覽、設定
      if (currentRole === 'staff') {
        document.getElementById('nav-admin').classList.add('hidden');
        document.getElementById('nav-settings').classList.add('hidden');
      } 
      // 第二級員工：看得到總覽，看不到設定與刪除相關按鈕
      else if (currentRole === 'manager') {
        document.getElementById('nav-settings').classList.add('hidden');
        document.getElementById('btn-clear-all').classList.add('hidden');
        document.getElementById('th-action').classList.add('hidden'); // 隱藏表格「操作」標題
      }
    }

    function startAutoRefresh() {
      if(autoRefreshTimer) clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(() => {
        if(currentView !== 'settings') fetchAllData();
      }, 5000); // 系統刷新時間10000=10秒
    } 

    // ====== 提示與彈窗 ======
    function showToast(msg) {
      const toast = document.getElementById('toast-msg');
      document.getElementById('toast-text').textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }
    
    function openModal(title, desc, actionData) {
      pendingAction = actionData;
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-desc').textContent = desc;
      document.getElementById('admin-pw-input').value = '';
      document.getElementById('pw-error-msg').classList.add('hidden');
      document.getElementById('custom-modal').classList.remove('hidden');
      setTimeout(() => document.getElementById('admin-pw-input').focus(), 100);
    }
    
    function closeModal() { document.getElementById('custom-modal').classList.add('hidden'); pendingAction = null; }
    
    function confirmAction() {
      const inputPw = document.getElementById('admin-pw-input').value;
      if (inputPw === PASS_LV3) { // 只有 Lv3 密碼可以執行危險操作
        const actionToExecute = pendingAction; 
        closeModal(); 
        sendAction(actionToExecute); 
      } else {
        document.getElementById('pw-error-msg').classList.remove('hidden');
        document.getElementById('admin-pw-input').value = '';
      }
    }
    document.getElementById('admin-pw-input').addEventListener('keypress', e => { if (e.key === 'Enter') confirmAction(); });

    function requestDelete(orderNum) { openModal('危險操作：刪除訂單', `確定要永久刪除 #${orderNum} 嗎？`, { action: 'delete', orderNumber: orderNum }); }
    function requestClearAll() { openModal('清空所有資料', '警告！這將會永久清空試算表內的所有訂單資料！', { action: 'clearAll' }); }

    // ====== 核心通訊 =======
    async function fetchAllData() {
      try {
        const t = new Date().getTime();
        // 根據權限決定要不要抓 config (Lv1 和 Lv2 不用抓)
        if (currentRole === 'admin') {
          const [ordersRes, configRes] = await Promise.all([fetch(GAS_API_URL + "?t=" + t), fetch(GAS_API_URL + "?action=config&t=" + t)]);
          orders = await ordersRes.json();
          configData = await configRes.json();
        } else {
          const response = await fetch(GAS_API_URL + "?t=" + t);
          orders = await response.json();
        }
        
        const now = new Date();
        document.getElementById('last-update').textContent = `已同步 ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        document.getElementById('loading-spinner').classList.add('hidden');
        renderUI();
      } catch (error) {
        console.error("同步失敗:", error);
      }
    }

    async function sendAction(payload) {
      clearInterval(autoRefreshTimer);
      showToast("處理中...");
      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (result.status === "success") {
          showToast("更新成功！");
          await fetchAllData(); 
        } else {
          showToast("操作失敗：" + result.message);
        }
      } catch (error) {
        showToast("網路錯誤。");
      } finally {
        startAutoRefresh();
      }
    }

    // ====== UI 渲染 =======
    function switchView(view) {
      currentView = view;
      const views = [
        { id: 'marking', color: 'bg-orange-600 text-white', default: 'hover:bg-slate-100 text-slate-600' },
        { id: 'finishing', color: 'bg-purple-600 text-white', default: 'hover:bg-slate-100 text-slate-600' },
        { id: 'admin', color: 'bg-slate-800 text-white', default: 'hover:bg-slate-100 text-slate-600' },
        { id: 'settings', color: 'bg-blue-600 text-white', default: 'hover:bg-slate-100 text-slate-600' }
      ];
      views.forEach(v => {
        const el = document.getElementById(`nav-${v.id}`);
        if(el) el.className = `px-4 py-2 rounded-lg text-sm font-bold flex items-center space-x-2 transition-colors ${currentView === v.id ? v.color : v.default}`;
      });
      
      if(currentView === 'settings') showToast("設定模式中已暫停自動更新");
      renderUI();
    }

    function renderUI() {
      document.getElementById('view-marking').classList.add('hidden');
      document.getElementById('view-finishing').classList.add('hidden');
      document.getElementById('view-admin').classList.add('hidden');
      document.getElementById('view-settings').classList.add('hidden');
      document.getElementById('empty-state').classList.add('hidden');

      if (currentView === 'marking') renderMarking();
      else if (currentView === 'finishing') renderFinishing();
      else if (currentView === 'admin') renderAdmin();
      else if (currentView === 'settings') renderSettings();
      
      lucide.createIcons();
    }

    function renderMarking() {
      const container = document.getElementById('view-marking');
      const pendingOrders = orders.filter(o => o['製作進度'] === '待製作');
      if (pendingOrders.length === 0) { document.getElementById('empty-state').classList.remove('hidden'); return; }
      container.classList.remove('hidden');
      container.innerHTML = pendingOrders.map(order => {
        const isPaid = order['收款狀態'] === '已收款';
        let visualHtml = '';
        if (order['圖樣'] !== '無') visualHtml += `<div class="flex items-center gap-2 bg-white p-1.5 rounded border"><img src="${imageMap.pattern[order['圖樣']] || ''}" class="h-10 w-10 object-contain"><span class="text-lg font-bold text-slate-600">正面圖樣: ${order['圖樣']}</span></div>`;
        if (order['打標文字'] !== '無') visualHtml += `<div class="mt-2 text-center bg-white p-2 rounded border font-mono font-bold text-2x1 tracking-wider">${order['打標文字']} <span class="text-lg text-slate-400">(${order['字型']})</span></div>`;
        if (order['背面打印'] && order['背面打印'] !== '無') visualHtml += `<div class="mt-3 border-t pt-2 border-dashed border-slate-300"><span class="text-lg font-bold text-blue-600 bg-blue-100 px-2 py-0.5 rounded-full inline-block mb-1">翻面打印</span><div class="text-center bg-blue-50 p-2 rounded border border-blue-200 font-mono font-bold text-2x1 tracking-wider text-blue-800">${order['背面打印']}</div></div>`;
        return `
          <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-orange-500 animate-in fade-in zoom-in duration-300 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start mb-3"><span class="bg-orange-100 text-orange-800 text-sm px-2.5 py-1 rounded-md font-mono font-bold">#${order['訂單編號']}</span><span class="text-xs font-bold ${isPaid ? 'text-emerald-600' : 'text-red-500 animate-pulse'}">${isPaid ? '已收' : '未收款!'}</span></div>
              <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 mb-4">
                <div class="mb-2"><span class="bg-slate-200 px-2 py-0.5 rounded text-lg font-bold text-slate-700">${order['商品造型']}</span> <span class="text-sm font-bold text-slate-500">${order['顏色']}色</span>${order['加購吊飾'] === '是' ? `<span class="text-xs font-bold text-yellow-600 bg-yellow-100 px-2 py-0.5 rounded ml-1 border border-yellow-200">附吊飾</span>` : ''}</div>
                ${visualHtml}
              </div>
            </div>
            <div class="flex items-center justify-between border-t pt-3 mt-auto">
              <div><span class="text-sm font-bold block">${order['訂購人姓名']}</span><span class="text-xs text-slate-400 block">${order['聯絡電話']}</span></div>
              <button onclick="sendAction({action:'update', orderNumber:'${order['訂單編號']}', updateType:'status', value:'待包裝'})" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center shadow-sm">完成打標 <i data-lucide="check-circle" class="w-4 h-4 ml-1"></i></button>
            </div>
          </div>`;
      }).join('');
    }

    function renderFinishing() {
      const container = document.getElementById('view-finishing');
      const finishingOrders = orders.filter(o => o['製作進度'] === '待包裝');
      if (finishingOrders.length === 0) { document.getElementById('empty-state').classList.remove('hidden'); return; }
      container.classList.remove('hidden');
      container.innerHTML = finishingOrders.map(order => {
        const isPaid = order['收款狀態'] === '已收款';
        let addOnBadges = '';
        if (order['加購吊飾'] === '是') addOnBadges += `<span class="bg-yellow-100 text-yellow-800 border border-yellow-200 px-2 py-0.5 rounded text-xs mr-2 font-bold inline-flex items-center"><i data-lucide="paperclip" class="w-3 h-3 mr-1"></i>加購吊飾</span>`;
        if (order['背面打印'] && order['背面打印'] !== '無') addOnBadges += `<span class="bg-blue-100 text-blue-800 border border-blue-200 px-2 py-0.5 rounded text-xs mr-2 font-bold inline-flex items-center"><i data-lucide="copy" class="w-3 h-3 mr-1"></i>背面文字: ${order['背面打印']}</span>`;
        
        return `
          <div class="bg-white p-4 rounded-2xl shadow-sm border flex flex-col sm:flex-row sm:items-center justify-between gap-4 transition-all ${isPaid ? 'border-emerald-200' : 'border-red-300 ring-2 ring-red-100'}">
            <div class="flex items-center gap-4">
              <div class="bg-purple-100 text-purple-700 p-3 rounded-xl font-bold font-mono text-lg shadow-inner shrink-0">#${order['訂單編號']}</div>
              <div>
                <h4 class="font-bold text-slate-800 text-lg">${order['訂購人姓名']} <span class="text-sm font-normal text-slate-400 ml-2">${order['聯絡電話']}</span></h4>
                <div class="text-lg text-slate-600 my-1 leading-relaxed">
                  <span class="bg-slate-100 px-2 py-0.5 rounded mr-2 border font-medium">${order['商品造型']} (${order['顏色']})</span>
                  ${order['圖樣'] !== '無' ? `<span class="inline-flex items-center mr-2 bg-white border border-slate-200 px-1.5 py-0.5 rounded shadow-sm"><img src="${imageMap.pattern[order['圖樣']] || ''}" class="h-6 w-6 object-contain mr-1"><span class="font-medium">圖:${order['圖樣']}</span></span>` : ''}
                  ${order['打標文字'] !== '無' ? `<span class="font-mono text-purple-600 font-bold bg-purple-50 px-2 py-0.5 rounded border border-purple-100 mr-2">${order['打標文字']}</span>` : ''}
                </div>
                <div class="mt-2 flex flex-wrap gap-1">${addOnBadges}</div>
              </div>
            </div>
            <div class="flex flex-col items-end gap-2 shrink-0 border-t sm:border-0 pt-3 sm:pt-0 w-full sm:w-auto">
              <div class="flex items-center gap-2 w-full sm:w-auto">
                <div class="font-black text-slate-700 text-xl w-full sm:w-auto text-right mr-2">$${order['金額']}</div>
                <button onclick="sendAction({action:'update', orderNumber:'${order['訂單編號']}', updateType:'payment', value:'${isPaid ? '未收款' : '已收款'}'})" class="whitespace-nowrap inline-flex justify-center items-center px-3 py-2 rounded-full text-xs font-bold transition-colors border shadow-sm flex-1 sm:flex-none ${isPaid ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-red-50 text-red-600 border-red-200 animate-pulse'}">
                  <i data-lucide="circle-dollar-sign" class="w-4 h-4 mr-1"></i> ${isPaid ? '已收款' : '尚未收款！'}
                </button>
              </div>
              <div class="flex items-center gap-2 w-full sm:w-auto">
                <button onclick="sendAction({action:'update', orderNumber:'${order['訂單編號']}', updateType:'status', value:'已完成'})" class="flex-1 sm:flex-none px-6 py-3 rounded-xl font-bold shadow-sm flex items-center justify-center transition-all ${isPaid ? 'bg-purple-600 hover:bg-purple-700 text-white' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}" ${!isPaid ? 'disabled title="請先收款"' : ''}>
                  <i data-lucide="package" class="w-4 h-4 mr-2"></i> 確認交付
                </button>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function renderAdmin() {
      document.getElementById('view-admin').classList.remove('hidden');
      const totalOrders = orders.length;
      const pendingCount = orders.filter(o => o['製作進度'] === '待製作').length;
      const finishingCount = orders.filter(o => o['製作進度'] === '待包裝').length;
      const totalRevenue = orders.reduce((sum, o) => sum + Number(o['金額']), 0);
      const collectedRevenue = orders.filter(o => o['收款狀態'] === '已收款').reduce((sum, o) => sum + Number(o['金額']), 0);

      document.getElementById('admin-stats').innerHTML = `
        <div class="bg-white p-5 rounded-2xl shadow-sm border text-center"><div class="text-slate-500 text-sm mb-1 font-medium">總訂單數</div><div class="text-2xl font-black text-blue-600">${totalOrders}</div></div>
        <div class="bg-white p-5 rounded-2xl shadow-sm border text-center"><div class="text-slate-500 text-sm mb-1 font-medium">待打標</div><div class="text-2xl font-black text-orange-600">${pendingCount}</div></div>
        <div class="bg-white p-5 rounded-2xl shadow-sm border text-center"><div class="text-slate-500 text-sm mb-1 font-medium">待交付</div><div class="text-2xl font-black text-purple-600">${finishingCount}</div></div>
        <div class="bg-white p-5 rounded-2xl shadow-sm border text-center"><div class="text-slate-500 text-sm mb-1 font-medium">已收 / 總營業額</div><div class="text-2xl font-black text-emerald-600">$${collectedRevenue} <span class="text-sm text-slate-400">/ $${totalRevenue}</span></div></div>
      `;

      document.getElementById('admin-table-body').innerHTML = orders.map(order => {
        const isPaid = order['收款狀態'] === '已收款';
        const progressColor = order['製作進度'] === '已完成' ? 'bg-emerald-100 text-emerald-700' : (order['製作進度'] === '待包裝' ? 'bg-purple-100 text-purple-700' : 'bg-orange-100 text-orange-700');
        let specAddons = '';
        if (order['加購吊飾'] === '是') specAddons += `<span class="text-yellow-600 text-xs font-bold bg-yellow-50 border border-yellow-200 px-1.5 py-0.5 rounded mr-1">附吊飾</span>`;
        if (order['背面打印'] && order['背面打印'] !== '無') specAddons += `<span class="text-blue-600 text-xs font-bold bg-blue-50 border border-blue-200 px-1.5 py-0.5 rounded">雙面打印</span>`;

        // 權限控制：隱藏刪除按鈕
        const deleteActionHtml = currentRole === 'admin' 
          ? `<td class="px-5 py-4 text-right"><button onclick="requestDelete('${order['訂單編號']}')" class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors"><i data-lucide="trash-2" class="w-5 h-5"></i></button></td>` 
          : `<td class="hidden"></td>`;
        // 包裝交付頁面
        return `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="px-5 py-4 font-mono text-slate-400 font-bold">${order['訂單編號']}</td>
            <td class="px-5 py-4"><div class="font-bold text-slate-800">${order['訂購人姓名']}</div><div class="text-slate-400 text-xs mt-1">${order['聯絡電話']}</div></td>
            <td class="px-5 py-4"><div class="mb-1.5"><span class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-xs mr-1 border">${order['商品造型']}</span><span class="text-slate-500 text-xs font-medium">${order['顏色']}色</span></div><div class="flex flex-wrap gap-1">${specAddons}</div></td>
            <td class="px-5 py-4 font-black text-slate-700 text-lg">$${order['金額']}</td>
            <td class="px-5 py-4"><button onclick="sendAction({action:'update', orderNumber:'${order['訂單編號']}', updateType:'payment', value:'${isPaid ? '未收款' : '已收款'}'})" class="px-3 py-1.5 rounded-full text-xs font-bold shadow-sm ${isPaid ? 'bg-emerald-100 text-emerald-700' : 'bg-red-50 text-red-500 border border-red-200'}">${isPaid ? '已收' : '未收'}</button></td>
            <td class="px-5 py-4"><span class="px-2.5 py-1.5 rounded-full text-xs font-bold ${progressColor}">${order['製作進度']}</span></td>
            ${deleteActionHtml}
          </tr>`;
      }).join('');
    }

    // 4. 參數設定 (僅 Lv3 可見)
    function renderSettings() {
      if(!configData) return;
      document.getElementById('view-settings').classList.remove('hidden');

      document.getElementById('settings-inv-body').innerHTML = configData.inventory.map((item, idx) => `
        <tr class="hover:bg-slate-50 border-b border-slate-50">
          <td class="px-5 py-3 font-bold text-slate-700">${item['造型']}</td>
          <td class="px-5 py-3"><span class="bg-slate-200 px-2 py-1 text-xs rounded font-bold">${item['顏色']}</span></td>
          <td class="px-5 py-3"><input type="number" id="inv-input-${idx}" value="${item['庫存數量']}" class="w-20 px-2 py-1.5 border border-slate-300 rounded outline-none focus:border-blue-500 text-center font-mono font-bold text-slate-800"></td>
          <td class="px-5 py-3"><button onclick="updateStock('${item['造型']}', '${item['顏色']}', 'inv-input-${idx}')" class="bg-blue-100 text-blue-700 hover:bg-blue-200 px-3 py-1.5 rounded text-xs font-bold transition-colors">儲存庫存</button></td>
        </tr>`).join('');

      document.getElementById('settings-pat-body').innerHTML = configData.patterns.map((item) => renderToggleRow('圖樣設定', item, Object.keys(item)[0], Object.keys(item)[1])).join('');
      document.getElementById('settings-font-body').innerHTML = configData.fonts.map((item) => renderToggleRow('字型設定', item, Object.keys(item)[0], Object.keys(item)[1])).join('');
    }

    function renderToggleRow(sheetName, item, nameCol, urlCol) {
      const name = item[nameCol]; const url = item[urlCol]; const isUp = item['狀態'] === '上架';
      return `
        <tr class="hover:bg-slate-50 border-b border-slate-50">
          <td class="px-4 py-3 font-bold text-slate-700">${name}</td>
          <td class="px-4 py-3 text-center">${url ? `<img src="${url}" class="h-8 max-w-[60px] object-contain mx-auto rounded border">` : '-'}</td>
          <td class="px-4 py-3 text-right"><button onclick="updateStatusConfig('${sheetName}', '${name}', '${isUp ? '下架' : '上架'}')" class="px-3 py-1.5 rounded text-xs font-bold transition-colors shadow-sm ${isUp ? 'bg-emerald-100 text-emerald-700 border border-emerald-200' : 'bg-slate-200 text-slate-500 border border-slate-300'}">${isUp ? '🟢 已上架' : '⚪ 已下架'}</button></td>
        </tr>`;
    }

    function updateStock(shape, color, inputId) {
      const newVal = document.getElementById(inputId).value;
      if(newVal === "" || newVal < 0) return alert("庫存不能為負數或空白！");
      sendAction({ action: 'updateConfig', sheetName: '商品與庫存', shape: shape, color: color, newStock: newVal });
    }
    function updateStatusConfig(sheetName, itemName, newStatus) { sendAction({ action: 'updateConfig', sheetName: sheetName, itemName: itemName, newStatus: newStatus }); }

    function exportToCSV() {
      if (orders.length === 0) return showToast("目前沒有資料可匯出");
      const headers = Object.keys(orders[0]);
      const csvRows = [headers.join(','), ...orders.map(row => headers.map(fieldName => `"${row[fieldName] || ''}"`).join(','))];
      const csvString = "\uFEFF" + csvRows.join('\n'); 
      const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `綠茶季_營運記錄_${new Date().toLocaleDateString()}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
